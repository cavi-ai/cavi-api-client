name: Bug report
description: Report a problem with @cavi-ai/api-client
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For **security vulnerabilities, do not file a public
        issue** — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the actual vs. expected behavior.
      placeholder: When I call createGatewayApiClient with provider "x", ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps or a code snippet that reproduces the issue.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - core/http
        - core/gateway (RPC / SSE / transports)
        - providers (hermes / openclaw / custom)
        - contracts / paths / team manifest
        - cavi adapters / degradation
        - react
        - types / build / tooling
        - other
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: "Node 20.11 / Bun 1.x / browser + bundler"
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, stack traces, screenshots, related issues.
    validations:
      required: false
