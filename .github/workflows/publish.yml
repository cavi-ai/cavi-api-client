name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every publish step without publishing to npm.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision stable documentation artifact
        run: |
          TARBALL="$(node scripts/docs/fetch-stable.mjs)"
          echo "CAVI_API_CLIENT_STABLE_TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "CAVI_DOCS_PACKAGE_TGZ=$TARBALL" >> "$GITHUB_ENV"

      - name: Verify package
        run: pnpm run verify

      # Trusted publishing (OIDC): no NPM_TOKEN. The npm CLI (>= 11.5.1) exchanges
      # the GitHub OIDC token (id-token: write above) for a short-lived npm
      # credential and attaches provenance automatically. Node 22 ships npm 10.x,
      # which predates trusted publishing, so upgrade npm first. (pnpm signs
      # provenance but does not perform the registry OIDC token exchange.)
      # Pin to npm 11.x: `npm@latest` is 12.0.0, whose `--provenance` path crashes
      # with `Cannot find module 'sigstore'`. 11.x supports trusted publishing and
      # has working provenance.
      # Requires a Trusted Publisher configured for @cavi-ai/api-client on
      # npmjs.com pointing at this repo + workflow file (publish.yml).
      - name: Publish package
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          # Idempotent: if this version is already on npm (e.g. a Release was
          # created/backfilled for an already-published version), skip the
          # publish so the run stays green instead of erroring on
          # "cannot publish over existing version".
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "@cavi-ai/api-client@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::@cavi-ai/api-client@${PKG_VERSION} is already published — skipping publish (idempotent)."
            exit 0
          fi
          npm install -g npm@11
          npm --version
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --access public --provenance --dry-run
          else
            npm publish --access public --provenance
          fi

  # Fan the release out to downstream consumers so they pick up the new version
  # without manual coordination. Each consumer listens for the
  # `api-client-released` repository_dispatch and bumps its dependency.
  #
  # Config (both required, else this no-ops without failing the release):
  #   vars.API_CLIENT_CONSUMER_REPOS  — space/newline-separated `owner/repo` list
  #   secrets.CONSUMER_DISPATCH_TOKEN — PAT with `repo` (or fine-grained
  #                                     contents:write) on those repos; the
  #                                     default GITHUB_TOKEN cannot dispatch
  #                                     cross-repo.
  notify-consumers:
    name: Notify consumers
    needs: npm
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dispatch api-client-released to consumers
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          CONSUMERS: ${{ vars.API_CLIENT_CONSUMER_REPOS }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$CONSUMERS" ]; then
            echo "::notice::CONSUMER_DISPATCH_TOKEN and/or API_CLIENT_CONSUMER_REPOS unset — skipping consumer notification."
            exit 0
          fi
          VERSION="$(node -p "require('./package.json').version")"
          echo "Notifying consumers of @cavi-ai/api-client@${VERSION}"
          for repo in $CONSUMERS; do
            echo "→ $repo"
            gh api "repos/${repo}/dispatches" \
              -f "event_type=api-client-released" \
              -F "client_payload[version]=${VERSION}" \
              -F "client_payload[package]=@cavi-ai/api-client" \
              || echo "::warning::dispatch to ${repo} failed"
          done
