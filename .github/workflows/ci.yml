name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
    env:
      HUSKY: 0
      CAVI_API_CLIENT_STABLE_TARBALL: ${{ runner.temp }}/cavi-docs-stable/cavi-ai-api-client-0.11.0.tgz
      CAVI_DOCS_PACKAGE_TGZ: ${{ runner.temp }}/cavi-docs-stable/cavi-ai-api-client-0.11.0.tgz
      SOURCE_DATE_EPOCH: 1783740944
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision stable documentation artifact
        run: |
          mkdir -p "$RUNNER_TEMP/cavi-docs-stable"
          npm pack @cavi-ai/api-client@0.11.0 --pack-destination "$RUNNER_TEMP/cavi-docs-stable"
          echo "3379cd47b4890d0e00f5949583f90a83367705878b16141e825f66ef5d8819e5  $CAVI_API_CLIENT_STABLE_TARBALL" | sha256sum --check --strict

      - name: Typecheck
        run: pnpm run typecheck

      - name: Acceptance gate (Runtime contract holds Claude-SDK shape)
        run: pnpm run typecheck:gate

      - name: Typecheck documentation examples
        run: pnpm run typecheck:docs

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Lint markdown
        run: pnpm run lint:md

      - name: Validate package tarball
        run: pnpm pack --dry-run
