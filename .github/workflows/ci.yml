name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Acceptance gate (Runtime contract holds Claude-SDK shape)
        run: pnpm run typecheck:gate

      - name: Typecheck documentation examples
        run: pnpm run typecheck:docs

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Lint markdown
        run: pnpm run lint:md

      - name: Validate package tarball
        run: pnpm pack --dry-run
