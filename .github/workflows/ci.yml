name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-guard:
    name: pin-guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      # Nothing here is pinned by hand. The guard on main judges every pull request.
      - if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git cat-file -e "$BASE:scripts/pin_guard.py"; then
            git show "$BASE:scripts/pin_guard.py" > "$RUNNER_TEMP/pin_guard.py"
          else
            cp scripts/pin_guard.py "$RUNNER_TEMP/pin_guard.py"
          fi
          python3 "$RUNNER_TEMP/pin_guard.py" "$BASE" "$HEAD"

  python:
    name: Python ${{ matrix.python-version }}
    needs: [pin-guard]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install build ruff
      - name: Check Python source
        run: ruff check python --select F
      - name: Validate installed Python artifacts without Node
        run: python python/scripts/verify_package.py
      - name: Test the pin guard
        run: python -m unittest discover -s scripts -p 'test_pin_guard.py'

  test:
    name: Node ${{ matrix.node-version }}
    needs: [pin-guard]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Provision stable documentation artifact
        run: |
          TARBALL="$(node scripts/docs/fetch-stable.mjs)"
          echo "CAVI_API_CLIENT_STABLE_TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "CAVI_DOCS_PACKAGE_TGZ=$TARBALL" >> "$GITHUB_ENV"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Acceptance gate (Runtime contract holds Claude-SDK shape)
        run: pnpm run typecheck:gate

      - name: Typecheck documentation examples
        run: pnpm run typecheck:docs

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Validate packed Python runtime consumer
        run: node scripts/test-python-consumer.mjs

      - name: Validate documentation and packed examples
        run: pnpm run docs:check

      - name: Lint markdown
        run: pnpm run lint:md

      - name: Validate package tarball
        run: pnpm pack --dry-run

  pin-consumers:
    # A green main moves the cavi-api-client pin in mlx-agent through its pin-client workflow.
    needs: [python, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require CONSUMER_DISPATCH_TOKEN
        env:
          TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: test -n "$TOKEN" || { echo "::error::Add the CONSUMER_DISPATCH_TOKEN repository secret"; exit 1; }
      - name: Dispatch client-merged to mlx-agent
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: gh api repos/cavi-ai/mlx-agent/dispatches --method POST -f event_type=client-merged
