name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install build ruff
      - name: Check Python source
        run: ruff check python --select F
      - name: Validate installed Python artifacts without Node
        run: python python/scripts/verify_package.py

  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Provision stable documentation artifact
        run: |
          TARBALL="$(node scripts/docs/fetch-stable.mjs)"
          echo "CAVI_API_CLIENT_STABLE_TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "CAVI_DOCS_PACKAGE_TGZ=$TARBALL" >> "$GITHUB_ENV"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Acceptance gate (Runtime contract holds Claude-SDK shape)
        run: pnpm run typecheck:gate

      - name: Typecheck documentation examples
        run: pnpm run typecheck:docs

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Validate packed Python runtime consumer
        run: node scripts/test-python-consumer.mjs

      - name: Validate documentation and packed examples
        run: pnpm run docs:check

      - name: Lint markdown
        run: pnpm run lint:md

      - name: Validate package tarball
        run: pnpm pack --dry-run
