name: Publish Python

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-python-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate Python distributions
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path('python/pyproject.toml').read_text())['project']
          if project['name'] != 'cavi-api-client':
              raise SystemExit('Unexpected Python distribution name')
          if os.environ['RELEASE_TAG'] != f"v{project['version']}":
              raise SystemExit('Release tag must match the Python package version')
          PY
      - name: Install build tools
        run: python -m pip install build ruff twine
      - name: Check Python source
        run: ruff check python --select F
      - name: Validate installed Python artifacts without Node
        run: python python/scripts/verify_package.py --artifacts-dir python-dist
      - name: Check distribution metadata
        run: python -m twine check --strict python-dist/*
      - name: Save verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: python-dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cavi-api-client/
    permissions:
      id-token: write
    steps:
      - name: Retrieve verified distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: python-dist
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist/
